<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="figTitle figDesc" font-family="Helvetica, Arial, sans-serif">
  <title id="figTitle">达妙电机反馈量：定点整数到物理量的线性映射</title>
  <desc id="figDesc">位置为 16 位无符号整数，范围 0 到 65535；速度与扭矩为 12 位无符号整数，范围 0 到 4095。每一路的整数中点对应物理量 0，最小值端对应负的最大值，最大值端对应正的最大值。转换公式为 x_float = x_int / (2^bits - 1) * (max - min) + min。</desc>

  <rect width="760" height="350" fill="#ffffff"/>

  <!-- ================= 面板 1：位置 ================= -->
  <text x="155" y="44" font-size="15" font-weight="bold" fill="#172033" text-anchor="middle">位置 POS · 16 位</text>
  <text x="155" y="65" font-size="12" fill="#6b7280" text-anchor="middle">p_int ∈ [0, 65535]</text>

  <line x1="90" y1="105" x2="90" y2="305" stroke="#333f52" stroke-width="1.5"/>
  <line x1="74" y1="205" x2="236" y2="205" stroke="#9aa4b2" stroke-width="1.2"/>
  <line x1="90" y1="290" x2="220" y2="120" stroke="#1f6feb" stroke-width="2.5"/>
  <circle cx="90" cy="290" r="3" fill="#1f6feb"/>
  <circle cx="220" cy="120" r="3" fill="#1f6feb"/>

  <text x="82" y="124" font-size="13" fill="#333f52" text-anchor="end">Pmax</text>
  <text x="82" y="209" font-size="13" fill="#333f52" text-anchor="end">0</text>
  <text x="82" y="294" font-size="13" fill="#333f52" text-anchor="end">−Pmax</text>
  <text x="90" y="326" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="214" y="326" font-size="12" fill="#6b7280" text-anchor="middle">65535</text>

  <!-- ================= 面板 2：速度 ================= -->
  <text x="395" y="44" font-size="15" font-weight="bold" fill="#172033" text-anchor="middle">速度 VEL · 12 位</text>
  <text x="395" y="65" font-size="12" fill="#6b7280" text-anchor="middle">v_int ∈ [0, 4095]</text>

  <line x1="330" y1="105" x2="330" y2="305" stroke="#333f52" stroke-width="1.5"/>
  <line x1="314" y1="205" x2="476" y2="205" stroke="#9aa4b2" stroke-width="1.2"/>
  <line x1="330" y1="290" x2="460" y2="120" stroke="#1f6feb" stroke-width="2.5"/>
  <circle cx="330" cy="290" r="3" fill="#1f6feb"/>
  <circle cx="460" cy="120" r="3" fill="#1f6feb"/>

  <text x="322" y="124" font-size="13" fill="#333f52" text-anchor="end">Vmax</text>
  <text x="322" y="209" font-size="13" fill="#333f52" text-anchor="end">0</text>
  <text x="322" y="294" font-size="13" fill="#333f52" text-anchor="end">−Vmax</text>
  <text x="330" y="326" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="454" y="326" font-size="12" fill="#6b7280" text-anchor="middle">4095</text>

  <!-- ================= 面板 3：扭矩 ================= -->
  <text x="635" y="44" font-size="15" font-weight="bold" fill="#172033" text-anchor="middle">扭矩 TOR · 12 位</text>
  <text x="635" y="65" font-size="12" fill="#6b7280" text-anchor="middle">t_int ∈ [0, 4095]</text>

  <line x1="570" y1="105" x2="570" y2="305" stroke="#333f52" stroke-width="1.5"/>
  <line x1="554" y1="205" x2="716" y2="205" stroke="#9aa4b2" stroke-width="1.2"/>
  <line x1="570" y1="290" x2="700" y2="120" stroke="#1f6feb" stroke-width="2.5"/>
  <circle cx="570" cy="290" r="3" fill="#1f6feb"/>
  <circle cx="700" cy="120" r="3" fill="#1f6feb"/>

  <text x="562" y="124" font-size="13" fill="#333f52" text-anchor="end">Tmax</text>
  <text x="562" y="209" font-size="13" fill="#333f52" text-anchor="end">0</text>
  <text x="562" y="294" font-size="13" fill="#333f52" text-anchor="end">−Tmax</text>
  <text x="570" y="326" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="694" y="326" font-size="12" fill="#6b7280" text-anchor="middle">4095</text>

  <!-- ================= 图注 ================= -->
  <line x1="24" y1="334" x2="736" y2="334" stroke="#e5e7eb" stroke-width="1"/>
  <text x="380" y="346" font-size="12" fill="#6b7280" text-anchor="middle">横轴 = CAN 帧中的无符号定点整数；纵轴 = 物理量。整数中点 → 0，两端 → ±MAX</text>
</svg>
